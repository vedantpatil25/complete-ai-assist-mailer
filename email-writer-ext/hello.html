<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AI-Assist Mailer</title>

    <style>
      body {
        margin: 0;
        width: 320px;
        font-family: "Google Sans", Roboto, Arial, sans-serif;
        background: #f1f3f4;
      }

      .container {
        padding: 18px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .logo {
        width: 32px;
        height: 32px;
      }

      .title {
        font-size: 18px;
        font-weight: 500;
        color: #202124;
      }

      .subtitle {
        font-size: 12px;
        color: #5f6368;
        margin-bottom: 18px;
      }

      .card {
        background: white;
        border-radius: 8px;
        padding: 14px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        margin-bottom: 14px;
      }

      .card-title {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 6px;
        color: #202124;
      }

      .card-text {
        font-size: 12px;
        color: #5f6368;
        line-height: 1.5;
      }

      .button {
        display: block;
        width: 100%;
        box-sizing: border-box;
        text-align: center;
        text-decoration: none;
        padding: 10px 0;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        background: #1a73e8;
        color: white;
        border: none;
        cursor: pointer;
      }

      .button:hover {
        background: #1669c1;
      }

      .footer {
        text-align: center;
        font-size: 11px;
        color: #5f6368;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <img src="extension_icon.png" class="logo" />
        <div class="title">AI-Assist Mailer</div>
      </div>

      <div class="subtitle">
        Generate smart email replies directly inside Gmail.
      </div>

      <div class="card">
        <div class="card-title">How it works</div>
        <div class="card-text">
          1. Open Gmail<br />
          2. Click Reply or Compose<br />
          3. Click the <b>AI Reply</b> button<br />
          4. Choose tone and generate reply
        </div>
      </div>

      <a href="https://mail.google.com" target="_blank" class="button">
        Open Gmail
      </a>

      <div class="footer">AI-Assist Mailer • Smart Email Automation</div>
    </div>
  </body>
</html>
